function Chat({h}){

 return html`<${React.Fragment}><section class=${'cp'+(min?' mn':'')} role="dialog" aria-label="EDU AI Assistant. Your learning and platform guide."><div class="ch"><span class="ea" style=${{width:40,height:40}}><${EduAvatar}/></span><div class="t"><strong>EDU</strong> <span class="mu" style=${{fontSize:'.85rem'}}>AI Learning Assistant</span><small>Here to help you learn and explore Eduxen</small><small>${smp===undefined?'Checking AI availability…':smp?'AI mode: answers generated by Claude':'Demo mode: canned answers, no AI model'}</small></div>

  ${tr&&html`<div class="msg">Troubleshooting mode <button class="btn sm" onClick=${()=>setTr(false)}>Exit</button></div>`}
  ${ms.map((m,i)=>html`<div key=${i} class=${'rw '+m.r}>${m.r==='a'?html`<span class="ea"><${EduAvatar}/></span>`:''}<div class=${'mb2 '+m.r}>${m.live&&!m.t?html`<span class="dots" role="status" aria-label="Waiting for answer"><i></i><i></i><i></i></span>`:fmt(m.t)}${m.demo?html`<div class="mu" style=${{fontSize:'.78rem',marginTop:8}}>Demo answer — not generated by an AI model.</div>`:''}${(m.l||[]).map(l=>html`<div key=${l}><a class="btn sm" href=${l} style=${{marginTop:8}}>Open ${l}</a></div>`)}${m.err&&html`<div><button class="btn sm" style=${{marginTop:8}} onClick=${()=>send(m.q,true)}>Retry</button></div>`}</div>${m.r==='u'?html`<span class="ea"><${Usr}/></span>`:''}</div>`)}<div ref=${end}></div></div>
  <form class="cc" onSubmit=${e=>{e.preventDefault();send(inp)}}><label for="cin" style=${{position:'absolute',left:-999}}>Message EDU</label><textarea id="cin" rows="1" maxlength="1000" value=${inp} placeholder="Ask about Eduxen or a topic…" onInput=${e=>setInp(e.target.value)} onChange=${e=>setInp(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp)}}}></textarea><button class="btn p" type="submit" disabled=${busy||!inp.trim()}>Send</button></form>`}</section>${btn}<//>`}
